name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      # The plugin has no build step and no runtime dependencies, so the tests run
      # straight from the checkout — nothing to install.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Inspect the publish payload
        run: npm pack --dry-run
