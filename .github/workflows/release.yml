name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token: npm trusted publishing + provenance attestation

jobs:
  npm-publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `registry-url` is deliberately NOT set: it makes setup-node write an
      # .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, which is
      # the token plumbing this workflow avoids. `publishConfig.registry` in
      # package.json already pins the registry.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # A tag can be re-pushed, re-run, or created for a version that already went
      # out by hand. npm rejects republishing an existing version, which would turn
      # a harmless re-run into a red pipeline — so check first and skip when the
      # version is already on the registry.
      - name: Is this version already published?
        id: guard
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-image-lite@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::dsh-image-lite@${version} is already on the registry — skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Authentication is OIDC trusted publishing: npm exchanges the GitHub OIDC
      # token for a short-lived publish credential, so there is no NPM_TOKEN secret
      # to provision, rotate, leak, or accidentally leave empty. Configure it once
      # on npmjs.com: package Settings → Trusted publishing → GitHub Actions,
      # repository `yupaoa/dsh-image-lite`, workflow `release.yml`.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && steps.guard.outputs.exists == 'false'
        run: npm publish --provenance --access public
