<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img" aria-labelledby="t d">
  <title id="t">dsh-image-lite 工作原理</title>
  <desc id="d">两种入口（对话模式、侧边栏工作台）共用同一条链路：插件读取 DSH 配置与凭据，向用户配置的生图供应商发起 HTTPS 请求，取回图片后写入指定目录。</desc>
  <style>
    .panel { fill: #f6f8fa; }
    .box   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .soft  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 3; }
    .t     { fill: #1f2328; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    .sub   { fill: #57606a; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    .flow  { stroke: #4c8dff; stroke-width: 1.8; fill: none; }
    .flowd { stroke: #4c8dff; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .cap   { fill: #4c8dff; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; }
      .box, .soft { fill: #161b22; stroke: #30363d; }
      .t   { fill: #e6edf3; }
      .sub { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dff"/>
    </marker>
  </defs>

  <rect class="panel" x="0" y="0" width="1200" height="576" rx="14"/>

  <text class="t" x="40" y="46" font-size="21" font-weight="600">dsh-image-lite 工作原理</text>
  <text class="sub" x="40" y="72" font-size="13">两种入口，同一条链路：AI 或你 → 插件 → 你配置的供应商 → 你的磁盘</text>

  <!-- Row 1: the two entry modes -->
  <rect class="box" x="40" y="96" width="520" height="84" rx="12"/>
  <text class="t" x="300" y="128" font-size="16" font-weight="600" text-anchor="middle">① 对话模式</text>
  <text class="sub" x="300" y="153" font-size="12.5" text-anchor="middle">和对话模型说「画一张…」→ 模型调用 image_generate_lite 工具</text>

  <rect class="box" x="640" y="96" width="520" height="84" rx="12"/>
  <text class="t" x="900" y="128" font-size="16" font-weight="600" text-anchor="middle">② 工作台模式</text>
  <text class="sub" x="900" y="153" font-size="12.5" text-anchor="middle">侧边栏「生图工作台」标签页 → 选参考图 / 写描述 → 点生成（本地 RPC）</text>

  <!-- Arrows into the plugin -->
  <path class="flow" d="M 300 180 L 300 240" marker-end="url(#arrow)"/>
  <text class="cap" x="312" y="214" font-size="12">工具调用</text>

  <path class="flow" d="M 900 180 L 900 240" marker-end="url(#arrow)"/>
  <text class="cap" x="888" y="214" font-size="12" text-anchor="end">RPC /image-gen-lite/*</text>

  <!-- Row 2: the plugin host -->
  <rect class="box" x="200" y="246" width="800" height="116" rx="12"/>
  <text class="t" x="600" y="276" font-size="16" font-weight="600" text-anchor="middle">插件宿主（运行在 DSH 进程内 · index.js / client.js）</text>
  <text class="sub" x="600" y="301" font-size="12.5" text-anchor="middle">读插件入口 image-gen-lite：供应商 · 默认模型 · 图片规格 · 输出目录</text>
  <text class="sub" x="600" y="323" font-size="12.5" text-anchor="middle">用环境变量名到 DSH 凭据服务换取密钥，组装 openai-images 请求</text>
  <text class="sub" x="600" y="345" font-size="12.5" text-anchor="middle">解码 b64_json 或下载结果 url → 写入图片文件 → 登记为会话附件</text>

  <!-- Arrows out of the plugin -->
  <path class="flow" d="M 380 364 L 210 414" marker-end="url(#arrow)"/>
  <text class="cap" x="300" y="404" font-size="12" text-anchor="middle">HTTPS</text>

  <path class="flow" d="M 600 364 L 600 414" marker-end="url(#arrow)"/>
  <text class="cap" x="612" y="394" font-size="12">writeFile</text>

  <path class="flowd" d="M 940 364 L 990 414" marker-end="url(#arrow)"/>
  <text class="cap" x="926" y="400" font-size="12" text-anchor="end">读配置 / 取密钥</text>

  <!-- Row 3: stores and the provider -->
  <rect class="box" x="40" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="210" y="450" font-size="15" font-weight="600" text-anchor="middle">生图供应商 API</text>
  <text class="sub" x="210" y="474" font-size="12" text-anchor="middle">POST {baseUrl}/images/generations</text>
  <text class="sub" x="210" y="496" font-size="12" text-anchor="middle">图生图时内联 image data URL</text>
  <text class="sub" x="210" y="518" font-size="12" text-anchor="middle">只连你填写的 baseUrl</text>

  <rect class="box" x="430" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="600" y="450" font-size="15" font-weight="600" text-anchor="middle">磁盘 · 图片输出</text>
  <text class="sub" x="600" y="474" font-size="12" text-anchor="middle">&lt;会话工作区&gt;/generate/image/</text>
  <text class="sub" x="600" y="496" font-size="12" text-anchor="middle">或插件页「图片存放位置」指定目录</text>
  <text class="sub" x="600" y="518" font-size="12" text-anchor="middle">只写这两个地方</text>

  <rect class="soft" x="820" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="990" y="450" font-size="15" font-weight="600" text-anchor="middle">DSH 凭据与配置</text>
  <text class="sub" x="990" y="474" font-size="12" text-anchor="middle">密钥：凭据服务（配置里只留掩码）</text>
  <text class="sub" x="990" y="496" font-size="12" text-anchor="middle">其余设置：profile 的插件入口</text>
  <text class="sub" x="990" y="518" font-size="12" text-anchor="middle">插件不落明文密钥</text>
</svg>
