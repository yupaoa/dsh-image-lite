<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img" aria-labelledby="t d">
  <title id="t">How dsh-image-lite works</title>
  <desc id="d">Two entry points — chat mode and the sidebar studio — share one pipeline: the plugin reads DSH config and credentials, calls the image provider you configured, and writes the result into the folder you chose.</desc>
  <style>
    .panel { fill: #f6f8fa; }
    .box   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .soft  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 3; }
    .t     { fill: #1f2328; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .sub   { fill: #57606a; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .flow  { stroke: #4c8dff; stroke-width: 1.8; fill: none; }
    .flowd { stroke: #4c8dff; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .cap   { fill: #4c8dff; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; }
      .box, .soft { fill: #161b22; stroke: #30363d; }
      .t   { fill: #e6edf3; }
      .sub { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dff"/>
    </marker>
  </defs>

  <rect class="panel" x="0" y="0" width="1200" height="576" rx="14"/>

  <text class="t" x="40" y="46" font-size="21" font-weight="600">How dsh-image-lite works</text>
  <text class="sub" x="40" y="72" font-size="13">Two entry points, one pipeline: you or the AI → the plugin → the provider you configured → your disk</text>

  <!-- Row 1: the two entry modes -->
  <rect class="box" x="40" y="96" width="520" height="84" rx="12"/>
  <text class="t" x="300" y="128" font-size="16" font-weight="600" text-anchor="middle">① Chat mode</text>
  <text class="sub" x="300" y="153" font-size="12.5" text-anchor="middle">Say “draw me …” → the model calls the image_generate_lite tool</text>

  <rect class="box" x="640" y="96" width="520" height="84" rx="12"/>
  <text class="t" x="900" y="128" font-size="16" font-weight="600" text-anchor="middle">② Studio mode</text>
  <text class="sub" x="900" y="153" font-size="12.5" text-anchor="middle">Sidebar “Image Studio” tab → references + prompt → Generate (local RPC)</text>

  <!-- Arrows into the plugin -->
  <path class="flow" d="M 300 180 L 300 240" marker-end="url(#arrow)"/>
  <text class="cap" x="312" y="214" font-size="12">tool call</text>

  <path class="flow" d="M 900 180 L 900 240" marker-end="url(#arrow)"/>
  <text class="cap" x="888" y="214" font-size="12" text-anchor="end">RPC /image-gen-lite/*</text>

  <!-- Row 2: the plugin host -->
  <rect class="box" x="200" y="246" width="800" height="116" rx="12"/>
  <text class="t" x="600" y="276" font-size="16" font-weight="600" text-anchor="middle">Plugin host (inside the DSH process · index.js / client.js)</text>
  <text class="sub" x="600" y="301" font-size="12.5" text-anchor="middle">Reads plugin entry image-gen-lite: provider · default model · aspect stop · image folder</text>
  <text class="sub" x="600" y="323" font-size="12.5" text-anchor="middle">Resolves the key by env-var name from DSH credentials, builds the openai-images request</text>
  <text class="sub" x="600" y="345" font-size="12.5" text-anchor="middle">Decodes b64_json or downloads the result url → writes the file → registers a session attachment</text>

  <!-- Arrows out of the plugin -->
  <path class="flow" d="M 380 364 L 210 414" marker-end="url(#arrow)"/>
  <text class="cap" x="300" y="404" font-size="12" text-anchor="middle">HTTPS</text>

  <path class="flow" d="M 600 364 L 600 414" marker-end="url(#arrow)"/>
  <text class="cap" x="612" y="394" font-size="12">writeFile</text>

  <path class="flowd" d="M 940 364 L 990 414" marker-end="url(#arrow)"/>
  <text class="cap" x="926" y="400" font-size="12" text-anchor="end">read config / resolve key</text>

  <!-- Row 3: stores and the provider -->
  <rect class="box" x="40" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="210" y="450" font-size="15" font-weight="600" text-anchor="middle">Image provider API</text>
  <text class="sub" x="210" y="474" font-size="12" text-anchor="middle">POST {baseUrl}/images/generations</text>
  <text class="sub" x="210" y="496" font-size="12" text-anchor="middle">image-to-image inlines an image data URL</text>
  <text class="sub" x="210" y="518" font-size="12" text-anchor="middle">only your configured baseUrl</text>

  <rect class="box" x="430" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="600" y="450" font-size="15" font-weight="600" text-anchor="middle">Disk · image output</text>
  <text class="sub" x="600" y="474" font-size="12" text-anchor="middle">&lt;session workspace&gt;/generate/image/</text>
  <text class="sub" x="600" y="496" font-size="12" text-anchor="middle">or the folder set under “Image folder”</text>
  <text class="sub" x="600" y="518" font-size="12" text-anchor="middle">it writes nowhere else</text>

  <rect class="soft" x="820" y="420" width="340" height="112" rx="12"/>
  <text class="t" x="990" y="450" font-size="15" font-weight="600" text-anchor="middle">DSH credentials &amp; config</text>
  <text class="sub" x="990" y="474" font-size="12" text-anchor="middle">keys: credential service (config keeps a mask)</text>
  <text class="sub" x="990" y="496" font-size="12" text-anchor="middle">other settings: the profile plugin entry</text>
  <text class="sub" x="990" y="518" font-size="12" text-anchor="middle">no plaintext keys in the plugin</text>
</svg>
